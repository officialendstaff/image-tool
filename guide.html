<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUIDE</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe4ea;--navy:#19283d;--ok:#3e765b}
*{box-sizing:border-box}body{margin:0;padding-bottom:82px;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
header{position:sticky;top:46px;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(16,24,40,.04)}
.wrap{max-width:1180px;margin:auto;padding:18px 22px}h1{margin:0;font-size:25px;letter-spacing:.035em}.category-tabs{display:grid;gap:8px;margin-top:14px}.category-tab{border:1px solid var(--line);background:#fff;color:#475467;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:800;font-size:14px}.category-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}main.wrap{padding-top:24px}.guide-video-wrap{max-width:520px;margin:0 auto}.guide-video-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px rgba(16,24,40,.045)}.guide-video{display:block;width:100%;height:auto;max-height:72vh;background:#000;border-radius:10px}
.panel{display:none}.panel.active{display:block}.work-panel{max-width:900px;margin:0 auto;padding-bottom:30px}.work-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.work-step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px rgba(16,24,40,.045);min-width:0}.work-step-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step-number{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:14px;flex:0 0 auto}.work-step h2{font-size:17px;margin:0}.work-preview{aspect-ratio:3/4;max-height:330px;background:#eef1f4;border:1px dashed #c8d0da;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#7d8998;font-size:13px;font-weight:700;margin-bottom:9px;text-align:center;padding:8px}.work-preview img{width:100%;height:100%;object-fit:contain;background:#e9edf1}.work-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.work-button,.work-file-label{border:1px solid var(--line);border-radius:9px;padding:11px 7px;font-weight:800;font-size:13px;line-height:1.25;text-align:center;cursor:pointer;min-height:43px;display:flex;align-items:center;justify-content:center;background:#fff;color:#475467}.work-button.primary{background:var(--navy);border-color:var(--navy);color:#fff}.work-button.done{background:var(--ok);border-color:var(--ok);color:#fff}.work-button:disabled{background:#f2f4f7;color:#98a2b3;border-color:#dfe4ea;cursor:not-allowed}.work-file-label input{display:none}.work-prompt-copy{width:100%;margin-top:7px}.reset-work{width:100%;border:1px solid var(--line);background:#fff;color:#667085;border-radius:9px;padding:12px;font-weight:800;cursor:pointer;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(16,24,40,.045)}.imgbox{position:relative;aspect-ratio:3/4;background:#eef1f4;overflow:hidden;display:grid;place-items:center;color:#98a2b3;font-size:12px;font-weight:700}.bg-grid .imgbox{aspect-ratio:4/3}.imgbox img{width:100%;height:100%;object-fit:cover;display:block}.cardbody{padding:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.asset-btn,.asset-file{border:1px solid var(--line);background:#fff;color:#475467;border-radius:8px;padding:10px 5px;font-weight:800;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}.asset-btn:disabled{color:#a6afba;background:#f4f6f8;cursor:not-allowed}.asset-file input{display:none}.section-title{font-size:12px;color:var(--muted);margin:0 0 12px;font-weight:800}
.chatgpt-dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(244,246,248,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line)}.chatgpt-button{display:flex;align-items:center;justify-content:center;width:100%;max-width:900px;min-height:50px;margin:0 auto;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-size:15px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 18px rgba(25,40,61,.18)}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:580px){.wrap{padding-left:12px;padding-right:12px}header .wrap{padding-top:13px;padding-bottom:13px}h1{font-size:20px}.category-tabs{gap:6px;margin-top:11px}.category-tab{padding:11px 6px;font-size:13px}main.wrap{padding-top:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.work-panel{padding-bottom:20px}.work-media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.work-step{padding:9px}.work-step-head{gap:6px;margin-bottom:8px}.step-number{width:24px;height:24px;font-size:11px}.work-step h2{font-size:14px}.work-preview{max-height:none;font-size:11px;padding:4px}.work-actions-row{gap:5px}.work-button,.work-file-label{min-height:39px;padding:8px 3px;font-size:11px}.asset-btn,.asset-file{font-size:11px;padding:9px 3px}}

.image-tool-global-nav{position:sticky;top:0;z-index:99998;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(17,24,39,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.10);font-family:Arial,'Noto Sans JP',sans-serif}
.image-tool-global-nav .it-brand{color:#fff;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.13em;margin-right:auto;white-space:nowrap}
.image-tool-global-nav .it-links{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none}.image-tool-global-nav .it-links::-webkit-scrollbar{display:none}
.image-tool-global-nav .it-link{color:#c7ced8;text-decoration:none;font-size:11px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:7px 10px;white-space:nowrap}
.image-tool-global-nav .it-link:hover{background:#202b3b;color:#fff}.image-tool-global-nav .it-link.active{background:#fff;color:#182233;border-color:#fff}
header{top:46px!important}@media(max-width:600px){.image-tool-global-nav{height:44px;padding:0 8px;gap:5px}.image-tool-global-nav .it-brand{font-size:10px}.image-tool-global-nav .it-links{gap:2px}.image-tool-global-nav .it-link{font-size:10px;padding:7px 6px}header{top:44px!important}}
</style><script>
const IMAGE_TOOL_AUTH_KEY='IMAGE_TOOL_AUTH';const IMAGE_TOOL_ACTIVE_KEY='IMAGE_TOOL_LAST_ACTIVE';const IMAGE_TOOL_TIMEOUT_MS=30*60*1000;
function imageToolAuthValid(){const ok=localStorage.getItem(IMAGE_TOOL_AUTH_KEY)==='1';const last=Number(localStorage.getItem(IMAGE_TOOL_ACTIVE_KEY)||0);return ok&&last>0&&(Date.now()-last)<IMAGE_TOOL_TIMEOUT_MS}
function imageToolTouchAuth(){if(localStorage.getItem(IMAGE_TOOL_AUTH_KEY)==='1')localStorage.setItem(IMAGE_TOOL_ACTIVE_KEY,String(Date.now()))}
function imageToolLock(){localStorage.removeItem(IMAGE_TOOL_AUTH_KEY);localStorage.removeItem(IMAGE_TOOL_ACTIVE_KEY);location.replace('index.html?locked=timeout')}
if(!imageToolAuthValid())imageToolLock();let imageToolLastTouch=0;['pointerdown','keydown','touchstart','scroll'].forEach(evt=>document.addEventListener(evt,()=>{const now=Date.now();if(now-imageToolLastTouch>30000){imageToolLastTouch=now;imageToolTouchAuth()}},{passive:true}));setInterval(()=>{if(!imageToolAuthValid())imageToolLock()},30000);
</script></head><body><nav class="image-tool-global-nav"><a class="it-brand" href="index.html">IMAGE TOOL</a><div class="it-links"><a class="it-link " href="background.html">背景</a><a class="it-link " href="outfit.html">衣装</a><a class="it-link " href="pose.html">ポーズ</a><a class="it-link active" href="guide.html">ガイド</a><a class="it-link " href="caution.html">注意点</a></div></nav><header><div class="wrap"><h1>GUIDE</h1></div></header><main class="wrap"><div class="guide-video-wrap"><div class="guide-video-card"><video class="guide-video" controls playsinline preload="metadata"><source src="guide.mp4" type="video/mp4">動画を再生できません。</video></div></div></main></body></html>
