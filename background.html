<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BACKGROUND</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#172033;font-family:Arial,"Noto Sans JP",sans-serif}.global{position:sticky;top:0;z-index:20;height:46px;display:flex;align-items:center;padding:0 14px;background:#111827}.brand{margin-right:auto;color:white;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.13em}.links{display:flex;gap:5px}.links a{color:#c7ced8;text-decoration:none;font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px}.links a.active{background:white;color:#182233}.head{background:#fff;border-bottom:1px solid #dfe4ea;padding:18px 0 0;position:sticky;top:46px;z-index:10}.wrap{max-width:1180px;margin:auto;padding:0 20px}.head h1{margin:0 0 13px;font-size:24px;letter-spacing:.04em}.tabs{display:flex;gap:8px;overflow:auto}.tab{border:1px solid #dfe4ea;background:#fff;color:#475467;border-radius:9px 9px 0 0;padding:11px 18px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:#19283d;color:#fff;border-color:#19283d}.main{padding:22px 0 80px}.panel{display:none}.panel.active{display:block}.workgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.work{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:16px}.work h2{margin:0 0 12px;font-size:17px}.preview{height:360px;background:#f2f4f7;border:1px solid #dfe4ea;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#98a2b3}.preview img{width:100%;height:100%;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn,.filebtn{border:1px solid #19283d;background:#fff;color:#19283d;border-radius:8px;padding:10px;font-weight:800;text-align:center;cursor:pointer}.btn.primary{background:#19283d;color:#fff}.filebtn input{display:none}.wide{width:100%;margin-top:9px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;overflow:hidden}.img{aspect-ratio:3/4;background:#eef1f4;display:flex;align-items:center;justify-content:center;color:#98a2b3;overflow:hidden}.bggrid .img{aspect-ratio:4/3}.img img{width:100%;height:100%;object-fit:cover}.card .actions{padding:0 8px 8px}.small{font-size:12px;padding:9px 4px}.sectiontitle{font-size:14px;color:#667085;margin:0 0 12px}.emptyguide{min-height:65vh}@media(max-width:700px){.wrap{padding:0 10px}.workgrid{grid-template-columns:1fr}.preview{height:280px}.grid{grid-template-columns:repeat(2,1fr)}.head h1{font-size:20px}.links a{padding:7px 5px;font-size:10px}}</style><body><nav class="global"><a class="brand" href="index.html">IMAGE TOOL</a><div class="links"><a class="active" href="background.html">背景</a><a class="" href="outfit.html">衣装</a><a class="" href="pose.html">ポーズ</a><a class="" href="guide.html">ガイド</a><a class="" href="caution.html">注意点</a></div></nav><header class="head"><div class="wrap"><h1>BACKGROUND</h1><div class="tabs"><button class="tab active" data-tab="work">作業</button><button class="tab " data-tab="standing">立ち</button><button class="tab " data-tab="seated">座り</button></div></div></header><main class="main"><div class="wrap"><section class="panel active" data-panel="work"><div class="workgrid"><article class="work"><h2>基準画像</h2><div class="preview" id="basePreview">基準画像を登録</div><div class="actions"><label class="filebtn">画像登録<input id="baseInput" type="file" accept="image/*"></label><button class="btn" id="copyBase">画像コピー</button></div><button class="btn wide" id="copyBaseText">画像固定をコピー</button></article><article class="work"><h2>背景変更</h2><div class="preview" id="targetPreview">素材を選択</div><div class="actions"><label class="filebtn">画像登録<input id="targetInput" type="file" accept="image/*"></label><button class="btn" id="copyTarget">画像コピー</button></div><button class="btn primary wide" id="copyChange">この作業の変更指示を使う</button></article></div></section><section class="panel" data-panel="standing"><p class="sectiontitle">立ち背景</p><div class="grid bggrid"><article class="card" data-slot="standing-0"><div class="img"><img src="assets/backgrounds/standing/01.webp"></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="standing-1"><div class="img"><img src="assets/backgrounds/standing/02.webp"></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="standing-2"><div class="img"><img src="assets/backgrounds/standing/03.webp"></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="standing-3"><div class="img"><span>未登録</span></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="standing-4"><div class="img"><span>未登録</span></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article></div></section><section class="panel" data-panel="seated"><p class="sectiontitle">座り背景</p><div class="grid bggrid"><article class="card" data-slot="seated-0"><div class="img"><img src="assets/backgrounds/seated/01.webp"></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="seated-1"><div class="img"><img src="assets/backgrounds/seated/02.webp"></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="seated-2"><div class="img"><span>未登録</span></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="seated-3"><div class="img"><span>未登録</span></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article><article class="card" data-slot="seated-4"><div class="img"><span>未登録</span></div><div class="actions"><button class="btn small choose">背景選択</button><label class="filebtn small">背景登録<input class="reg" type="file" accept="image/*"></label></div></article></div></section></div></main><script>const FIX="\u3053\u308c\u3092\u57fa\u6e96\u753b\u50cf\u3068\u3057\u3066\u4f7f\u7528\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\u3053\u306e\u5973\u6027\u30fb\u9854\u30fb\u9aea\u578b\u30fb\u4f53\u578b\u30fb\u8863\u88c5\u30fb\u9774\u30fb\u80cc\u666f\u30fb\u5bb6\u5177\u30fb\u753b\u89d2\u30fb\u69cb\u56f3\u30fb\u7167\u660e\u3092\u57fa\u6e96\u3068\u3057\u3066\u7dad\u6301\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\u6b21\u306b\u5909\u66f4\u7528\u306e\u53c2\u7167\u753b\u50cf\u3092\u9001\u308a\u307e\u3059\u3002",CHANGE="1\u679a\u76ee\u306e\u753b\u50cf\u3092\u57fa\u6e96\u753b\u50cf\u3068\u3057\u3066\u4f7f\u7528\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n2\u679a\u76ee\u306e\u753b\u50cf\u304b\u3089\u3001\u80cc\u666f\u3060\u3051\u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n1\u679a\u76ee\u306e\u5973\u6027\u306e\u9854\u30fb\u9aea\u578b\u30fb\u4f53\u578b\u30fb\u8863\u88c5\u30fb\u9774\u30fb\u30dd\u30fc\u30ba\u30fb\u8eab\u4f53\u306e\u5411\u304d\u30fb\u753b\u89d2\u30fb\u69cb\u56f3\u30fb\u7167\u660e\u306f\u7dad\u6301\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n1\u679a\u76ee\u306e\u4eba\u7269\u306f\u5909\u66f4\u305b\u305a\u3001\u80cc\u666f\u3060\u3051\u30922\u679a\u76ee\u306e\u898b\u672c\u753b\u50cf\u306e\u80cc\u666f\u306b\u5909\u66f4\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\u5bb6\u5177\u306f2\u679a\u76ee\u306e\u80cc\u666f\u306b\u542b\u307e\u308c\u308b\u3082\u306e\u3060\u3051\u3092\u4f7f\u7528\u3057\u3001\u4eba\u7269\u306e\u4f4d\u7f6e\u30fb\u5927\u304d\u3055\u30fb\u5411\u304d\u306f1\u679a\u76ee\u3092\u7dad\u6301\u3057\u3066\u304f\u3060\u3055\u3044\u3002";let baseSrc='',targetSrc='';
function show(preview,src){preview.innerHTML=src?`<img src="${src}">`:'未登録'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`[data-panel="${b.dataset.tab}"]`).classList.add('active')});
function fileData(f,cb){if(!f)return;let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
baseInput.onchange=e=>fileData(e.target.files[0],s=>{baseSrc=s;show(basePreview,s)});targetInput.onchange=e=>fileData(e.target.files[0],s=>{targetSrc=s;show(targetPreview,s)});
async function copyImg(src){if(!src)return alert('画像がありません');let im=new Image();im.onload=async()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);let b=await new Promise(r=>c.toBlob(r,'image/png'));try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})])}catch(e){alert('画像コピーに対応していません')}};im.src=src}
copyBase.onclick=()=>copyImg(baseSrc);copyTarget.onclick=()=>copyImg(targetSrc);copyBaseText.onclick=()=>navigator.clipboard.writeText(FIX);copyChange.onclick=()=>navigator.clipboard.writeText(CHANGE);
document.querySelectorAll('.card').forEach(c=>{let img=c.querySelector('img');let slot=c.dataset.slot;let saved=localStorage.getItem('slot-'+slot);if(saved){c.querySelector('.img').innerHTML=`<img src="${saved}">`;img=c.querySelector('img')}c.querySelector('.choose').onclick=()=>{img=c.querySelector('img');if(!img)return alert('画像を登録してください');targetSrc=img.src;show(targetPreview,targetSrc);document.querySelector('[data-tab="work"]').click();};c.querySelector('.reg').onchange=e=>fileData(e.target.files[0],s=>{localStorage.setItem('slot-'+slot,s);c.querySelector('.img').innerHTML=`<img src="${s}">`;})});</script></body></html>
